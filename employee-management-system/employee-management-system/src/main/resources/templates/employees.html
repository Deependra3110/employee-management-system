
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">
        <h1>Employee Management System</h1>
        <p>Manage your employees easily.</p>

        <a th:href="@{/employees/new}" class="btn">+ Add Employee</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.firstName}"></td>
                    <td th:text="${employee.lastName}"></td>
                    <td th:text="${employee.email}"></td>
                    <td th:text="${employee.department}"></td>
                    <td th:text="${employee.salary}"></td>
                    <td>
                        <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                           class="edit-btn">Edit</a>

                        <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                              method="post" class="inline-form">
                            <button type="submit" class="delete-btn"
                                    onclick="return confirm('Delete this employee?')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7">No employees found. Add your first employee!</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
