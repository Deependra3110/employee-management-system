
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>Update Employee</h1>

    <form th:action="@{/employees/{id}(id=${employee.id})}"
          th:object="${employee}" method="post">

        <label>First Name</label>
        <input type="text" th:field="*{firstName}">
        <small class="error" th:if="${#fields.hasErrors('firstName')}"
               th:errors="*{firstName}"></small>

        <label>Last Name</label>
        <input type="text" th:field="*{lastName}">
        <small class="error" th:if="${#fields.hasErrors('lastName')}"
               th:errors="*{lastName}"></small>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <small class="error" th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></small>

        <label>Department</label>
        <input type="text" th:field="*{department}">
        <small class="error" th:if="${#fields.hasErrors('department')}"
               th:errors="*{department}"></small>

        <label>Salary</label>
        <input type="number" step="0.01" th:field="*{salary}">
        <small class="error" th:if="${#fields.hasErrors('salary')}"
               th:errors="*{salary}"></small>

        <button type="submit" class="btn">Update Employee</button>
        <a th:href="@{/employees}" class="cancel-btn">Cancel</a>

    </form>
</div>

</body>
</html>
